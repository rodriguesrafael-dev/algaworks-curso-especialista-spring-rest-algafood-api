spring.datasource.url=jdbc:postgresql://localhost:5432/algafood?currentSchema=algafood
spring.datasource.username=algafood
spring.datasource.password=123
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.generateDdl=true
spring.jpa.hibernate.ddlAuto=create
spring.jpa.showSql=true
spring.jpa.propertiers.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect